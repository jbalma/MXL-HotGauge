# End-to-end configuration for: Sniper -> McPAT -> trace generation -> 3D-ICE sim -> analysis

config_version: 1

# ============================================================================
# USER EDIT SECTION
# ============================================================================

user_edit:

  # -------------------------
  # Experiment naming
  # -------------------------
  experiment_name:    #Outputs will live in /HotGauge/examples/{experiment_name}
    
  # If true, delete and rebuild the experiment directory if it already exists
  recreate_if_exists: false

  # -------------------------
  # Sniper configuration
  # -------------------------
  #Pathway to the sniper configuration file. A sample one lives here: HotGauge/examples/skylake_14nm.cfg
  sniper_cfg:
  num_cores:
  max_mcpat_jobs: 
  sde_arch:  #architecture Sniper will use, for example, tgl 
  roi_enable: #ROI commd line input to sniper
  # Statistics printed at this nanosecond interval
  energystats_interval: 

  # Stop simulation after this many instructions
  instruction_count: 

  # -------------------------
  # Sniper output labeling
  # -------------------------
  frequency_label:  #frequency of the experiment

  # -------------------------
  # Warmup / floorplan inputs
  # -------------------------
  #path to the the warmup file. One sample lives here: 
  #HotGauge/examples/template/warmups/skylake_HS483/idle_00/skylake7nm_7core_3_3D-ICE_template.flp
  tstack_path:
  #The name of the flp template, see HotGauge/examples/template/floorplans/outputs for examples
  flp_template_name:

  # -------------------------
  # Workload configuration
  # -------------------------
  # Options:
  #   single   -> run one executable
  #   multiple -> run several executables and create workloads.json
  workload_mode: single
  
  #config file assumes if you are running multiple executables in an experiment they
  #live in the same directory
  executable_root: 

  # Names of executables located inside executable_root
  executable_names:
    - mults
    # - executable_B_name

  # Arguments passed to each executable
  executable_args:
    # - "1397"
    # - "8"

  #how sniper cores mapped to 3d-ice cores
  core_mapping:
    mode: dict_target_to_source
    map:
      0: 0

# ============================================================================
# Derived From Above User-Edited Options:
# ============================================================================

# ============================================================================
# GLOBAL / OUTPUT PATHS
# ============================================================================

paths:

  # This config file assumes it is living in /HotGauge/end_to_end
  hotgauge_root: ${cwd}/..

  snipersim_root: ${paths.hotgauge_root}/snipersim
  scripts_dir: ${paths.hotgauge_root}/scripts
  examples_dir: ${paths.hotgauge_root}/examples
  template_dir: ${paths.examples_dir}/template

experiment:
  name: ${user_edit.experiment_name}
  recreate_if_exists: ${user_edit.recreate_if_exists}

# ============================================================================
# SNIPER STAGE
# ============================================================================

sniper:

  sniper_cfg: ${user_edit.sniper_cfg}
  num_cores: ${user_edit.num_cores}
  sde_arch: ${user_edit.sde_arch}
  roi_enable: ${user_edit.roi_enable}

  energystats_interval: ${user_edit.energystats_interval}
  instruction_count: ${user_edit.instruction_count}

  output_root: ${paths.snipersim_root}/output
  tech_node_label: 14nm
  frequency_label: ${user_edit.frequency_label}

  # Auto-generated by loader from:
  #   user_edit.executable_root
  #   user_edit.executable_names
  #   user_edit.executable_args
  executables: []

# ============================================================================
# McPAT STAGE
# ============================================================================

mcpat:
  script: ${paths.scripts_dir}/14_perf_sims_to_7_10_14_power_sims.sh
  max_jobs: ${user_edit.max_mcpat_jobs}
# ============================================================================
# TRACE + METADATA GENERATION
# ============================================================================

trace_gen:

  make_pow_trace_script: ${paths.examples_dir}/${experiment.name}/make_pow_trace.py

  prefix_from_executable_name: true

  traces_subdir: Traces
  metadata_subdir: Metadata

  workload_manifest:
    enabled_if_multiple_executables: true
    make_workload_json_script: ${paths.examples_dir}/${experiment.name}/make_workload_json.py
    output_filename: workloads.json

# ============================================================================
# 3D-ICE STAGE (sim_from_warmup)
# ============================================================================

ice:

  sim_from_warmup_script: ${paths.examples_dir}/${experiment.name}/sim_from_warmup.py

  warmup:
    tstack_path: ${user_edit.tstack_path}

  flp:
    template_name: ${user_edit.flp_template_name}

  workloads:

    # Loader converts:
    #   single   -> mode: single
    #   multiple -> mode: manifest
    mode: single

    manifest_path: ${paths.examples_dir}/${experiment.name}/workloads.json
